# dfew finetuning configuration
# This file contains all the parameters for training the emoti-detection model

model:
  name: vit_base_dim512_no_depth_patch16_160
  tubelet_size: 2
  input_size: 160
  drop: 0.0
  attn_drop_rate: 0.0
  drop_path: 0.1
  use_mean_pooling: True
  depth: 16
  
  
  # Attention configuration
  attn_type: local_global
  lg_region_size: [2, 5, 10]
  lg_first_attn_type: self
  lg_third_attn_type: cross
  lg_attn_param_sharing_first_third: false
  lg_attn_param_sharing_all: false
  lg_classify_token_type: region
  lg_no_second: false
  lg_no_third: false

data:
  dataset_name: DFEW
  data_path: /root/shared/fliangae/Facial-Foundation-Model/saved/data/dfew/split01
  eval_data_path: null
  num_classes: 7
  # num_classes_cls: 7
  # num_dim_reg: 2
  num_segments: 1
  num_frames: 16
  sampling_rate: 1
  imagenet_default_mean_and_std: true
  
  # Data loading
  batch_size: 24
  num_workers: 20
  pin_memory: true

  task: classification

augmentation:
  # Basic augmentation
  color_jitter: 0.4
  train_interpolation: bicubic
  num_sample: 1  # Disabled for gaze estimation
  
  # Auto augmentation (disabled for gaze)
  # auto_augment: null
  
  # Mixup augmentation (disabled for gaze estimation)
  mixup: 0.8
  cutmix: 1.0
  cutmix_minmax: null
  mixup_prob: 1.0
  mixup_switch_prob: 0.5
  mixup_mode: batch
  
  # Random erase augmentation
  random_erase_prob: 0.25
  random_erase_mode: pixel
  random_erase_count: 1
  random_erase_split: false
  
  # Label smoothing (disabled for regression)
  label_smoothing: 0.1

optimization:
  optimizer: adamw
  lr: 0.001
  min_lr: 0.000001
  warmup_lr: 0.000001
  # warmup_lr: 0.001
  weight_decay: 0.05
  weight_decay_end: null
  
  # Learning rate schedule
  warmup_epochs: 5
  warmup_steps: -1
  
  # Optimizer specific
  opt_eps: 0.00000001
  opt_betas: [0.9, 0.999]
  momentum: 0.9
  
  # Gradient clipping
  clip_grad: null
  layer_decay: 0.75

training:
  epochs: 100
  start_epoch: 0
  update_freq: 10
  save_ckpt_freq: 1
  
  # Model EMA
  model_ema: false
  model_ema_decay: 0.9999
  model_ema_force_cpu: false
  
  # Evaluation
  disable_eval_during_finetuning: false
  eval_only: false
  dist_eval: false
  
  # Checkpointing
  save_ckpt: true
  auto_resume: true
  resume: ''
  finetune: /root/shared/fliangae/Facial-Foundation-Model/output/checkpoint-49.pth

  # finetune: null

  # Validation metric
  val_metric: acc1

  # freeze
  freeze: true
  use_lora: true

gaze:
  # L2CS configuration (advanced gaze estimation method)
  use_l2cs: false  # Set to true for L2CS method
  num_bins: 90
  alpha_reg: 1.0
  bin_width: 2.0

system:
  device: cuda
  seed: 0
  output_dir: ./output/dfew_finetune_shortcutconv2
  log_dir: null
  
  # Distributed training
  world_size: 4  # 设置为您的GPU数量
  local_rank: -1
  dist_on_itp: false
  dist_url: env://
  distributed: true  # 启用分布式训练
  
  # DeepSpeed (advanced optimization)
  enable_deepspeed: false
  
  # Features
  save_feature: false
